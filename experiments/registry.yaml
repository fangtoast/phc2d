schema_version: 1
last_reviewed: 2026-08-21

registry_scope:
  policy: >-
    Register active, scientifically valuable, or paper-relevant formal experiments.
    Seeds and reruns remain run-level records and do not receive new Experiment IDs.
  evidence_boundary: >-
    A registry link records a confirmed repository relationship. It does not promote
    draft documentation, surrogate-only evidence, or referenced-but-absent runs to
    formal physical validation.
  excluded_by_default:
    - environment audits and deployment notes
    - ordinary smoke tests, dry runs, and visualization-only runs
    - superseded exploratory history with no current research or paper value

schema:
  id_pattern: '^EXP-(FWD|QRY|INV|PHY|DAT)-[0-9]{3}$'
  required_fields:
    - id
    - title
    - task
    - status
    - mapping_status
    - research_question
    - spec
    - config
    - runs
    - result
    - report
    - related_experiments
    - decision
    - tags
  task_values:
    - forward
    - query
    - inverse
    - physical_validation
    - data
  status_values:
    - planned
    - active
    - pilot
    - completed
    - blocked
    - superseded
  mapping_status_values:
    - complete
    - partial
  run_availability_values:
    - local
    - referenced_not_local
  decision_state_values:
    - accepted
    - continue
    - pending
    - blocked
  field_contracts:
    spec: Repository-relative experiment-protocol paths; empty when no exact protocol is confirmed.
    config: Repository-relative formal configuration paths.
    runs: Run paths grouped by local availability; seeds and reruns belong here.
    result: Curated evidence pages; an empty list means no admissible result yet.
    report: Synthesis pages that cite the experiment; not a substitute for raw evidence.
    related_experiments: Other registered Experiment IDs with a confirmed scientific dependency.
    decision: Current research disposition, separated into a controlled state and concise summary.

