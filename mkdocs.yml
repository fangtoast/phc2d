# MkDocs configuration for the phc2d research documentation site.
# Author: fangtoast
# Email: fangtoast@foxmail.com
# Copyright (c) 2026 fangtoast. All rights reserved.

site_name: phc2d 文档
site_description: 二维光子晶体数据、神经代理、逆向设计与真实求解器复核文档
site_author: fangtoast
repo_url: https://github.com/fangtoast/phc2d
repo_name: fangtoast/phc2d
edit_uri: blob/master/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: readthedocs
  locale: zh_CN
  highlightjs: true
  hljs_languages:
    - bash
    - json
    - powershell
    - python
    - yaml

plugins:
  - search:
      lang:
        - en

markdown_extensions:
  - admonition
  - attr_list
  - fenced_code
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      title: 本页目录
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - assets/javascripts/mermaid.js

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

exclude_docs: |
  /README.md
  results/representation_benchmark_20260813.md

not_in_nav: |
  README.md
  getting-started.md
  reproducibility.md
  architecture.md
  hpc_physics_campaigns.md
  reports/assets/*/figure_index.md

