experiment:
  experiment_id: query_model_matrix_gpu_preflight
  family: smoke
  stage: query_preflight
dataset:
  path: data/paper_like_64_mpb.npz
  input_repr: epsilon_grid
  output_target: band_query
  lazy_queries: true
query:
  allow_index_query: true
  requires_physical_k_coordinates: false
runtime:
  device: cuda:0
  require_accelerator: true
  device_index: 0
  precision: fp32
  amp_enabled: false
  tf32_enabled: false
  record_peak_memory: true
  non_blocking_transfer: true
  num_workers: 0
  pin_memory: true
training:
  epochs: 1
  batch_size: 8
  learning_rate: 0.001
  device: cuda:0
  seeds:
    - 0
models:
  note: use model.candidates for runner compatibility
model:
  candidates:
    - mlp_query
    - deep_onet_query
    - fno2d_query
  overrides:
    hidden_dim: 32
    branch_width: 32
    trunk_width: 32
    latent_dim: 16
    width: 8
    depth: 2
    modes: [4, 5]
    query_hidden_dim: 16
protocols:
  - unseen_structure_all_k
  - unseen_structure_k_interpolation
  - unseen_structure_heldout_segment
limits:
  max_train_structures: 16
  max_eval_structures: 8
  max_train_steps: 1
  max_eval_queries: 32
output:
  runs_dir: runs
