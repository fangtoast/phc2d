# Minimal forward training run over the synthetic clean-clone smoke dataset.
# Author: fangtoast
# Email: fangtoast@foxmail.com
# Copyright (c) 2026 fangtoast. All rights reserved.

experiment:
  experiment_id: forward_synthetic_res_mlp_smoke
  family: smoke
  stage: forward_train
dataset:
  path: data/generated/phc2d_synthetic_smoke.npz
  input_repr: rho_wedge
  output_target: Wh
  smoke: true
model:
  name: res_mlp
  params:
    hidden_dim: 16
    depth: 1
training:
  epochs: 1
  batch_size: 4
  learning_rate: 0.001
  seed: 7
  device: auto
runtime:
  device: auto
  require_accelerator: false
  precision: fp32
  amp_enabled: false
  non_blocking_transfer: true
  record_peak_memory: true
evaluation:
  split: test
metrics:
  relative_error_floor: 1.0e-8
output:
  runs_dir: runs
