experiment:
  experiment_id: SMOKE-FWD-GAP-AWARE-001
  family: full_cell_k5_gap_aware_engineering_smoke
  lane: joint
  evidence_status: non_scientific_cpu_admission_probe
datasets:
  binary:
    path: data/full_cell_binary_fourier_k5_bz9_10000_xingyi_v1.h5
    grid_field: material_area_fraction_grid_64
    expected_dataset_sha256: 7d2c6bef128c7ee61e0c5ca0eb9561b95992ccf8e53f325274c4889752ea86b6
  graded:
    path: data/full_cell_graded_fourier_k5_bz9_10000_xingyi_v1.h5
    grid_field: material_weight_grid_64
    expected_dataset_sha256: eb140534d941cbdb53addca279f00337810124a34fade20a19bfb969e0e6af20
representation:
  source: lane_specific_grid
  sampling: continuous
  threshold: null
  resolution: 64
  physical_equivalence: true
  label_semantics: k5_fourier_lane_specific_Wh
model:
  name: dual_lane_band_operator_v1
  params:
    width: 8
    depth: 1
    modes: [4, 4]
    factorization_rank: 0.5
    norm_groups: 2
    channel_expansion: 2
    local_kernel: 3
    drop_path: 0.0
    num_lanes: 2
    lane_embedding_dim: 8
    head_hidden_dim: 16
    band_embedding_dim: 8
    fourier_frequencies: [1, 2]
    dropout: 0.0
training:
  train_size: 64
  train_subset_salt: gap-aware-engineering-smoke-v1
  max_epochs: 1
  early_stopping_patience: 0
  optimizer: adamw
  learning_rate: 0.0005
  weight_decay: 0.00001
  micro_batch_size: 4
  effective_batch_size: 4
  lane_batch_size: {binary: 2, graded: 2}
  loss:
    name: equal_lane_gap_aware_v1
    lower_band_min_one_based: 2
    lower_band_max_one_based: 9
    full_spectrum_weight: 1.0
    gap_profile_weight: 0.05
    selected_edge_weight: 0.05
    selected_width_weight: 0.05
    selected_center_weight: 0.05
    selected_upper_profile_weight: 0.10
  checkpoint_selection: equal_lane_validation_bands_2_10_mre
runtime:
  device: cpu
  require_accelerator: false
  precision: fp32
  amp_enabled: false
  tf32_enabled: false
  num_workers: 0
  pin_memory: false
  non_blocking_transfer: false
output:
  runs_dir: runs
