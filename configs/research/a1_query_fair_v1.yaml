experiment:
  experiment_id: a1_query_fair_v1
  family: research
  stage: query_a1_fair_selection

dataset:
  path: data/query_dataset_v2_pilot_10000_mpb.npz
  representation: epsilon_grid
  input_repr: epsilon_grid
  target: band_query
  output_target: band_query
  lazy_queries: true

fair_selection:
  enabled: true
  expected_dataset_sha256: 991cb3810e881938755495ad0bccfa5b091194c2b74451842a9a50ddce974ad4
  expected_split_sizes: {train: 6875, val: 2500, test: 625}
  selection_split: val
  final_evaluation_split: test
  selection_metric: query_mre_bands_2_10_pct
  require_exact_seed_count: 3

query:
  requires_physical_k_coordinates: true
  allow_index_query: false
  boundary: neural_surrogate_no_mpb_meep_generated_not_replayed

protocols:
  - unseen_structure_all_k
  - unseen_structure_physical_k_interpolation
  - unseen_structure_physical_heldout_segment

model:
  candidates: [mlp_query, deep_onet_query_v2, fno2d_query_v2]
  params_by_model:
    mlp_query: {hidden_dim: 64, depth: 2}
    deep_onet_query_v2: {branch_width: 128, trunk_width: 128, latent_dim: 128, depth: 4}
    fno2d_query_v2: {width: 32, depth: 4, modes: [8, 8], query_hidden_dim: 64}

training:
  max_epochs: 200
  checkpoint_epochs: [10, 30, 50, 100, 150, 200]
  learning_rates: [0.001, 0.0003, 0.0001]
  seeds: [0, 1, 2]
  optimizer: adamw
  weight_decay: 1.0e-5
  batch_size: 64

runtime:
  device: cuda:0
  require_accelerator: true
  precision: fp32
  amp_enabled: false
  tf32_enabled: false
  record_peak_memory: true

metrics:
  include: [query_mre_bands_2_10_pct, query_mae, query_rmse, ordering_violation_rate, train_time_s, eval_time_s, query_inference_time_per_query_ms, peak_gpu_memory_mb]

output:
  runs_dir: runs
  write_query_report: false
  write_dataset_audit_report: false
