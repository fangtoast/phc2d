# Copyright (c) 2026 fangtoast. All rights reserved.

experiment:
  experiment_id: inverse_mpb_replay_v2_10000_strategy_pilot
  family: research
  stage: inverse_strategy_mpb_replay_pilot

dataset:
  path: data/query_dataset_v2_pilot_10000_mpb.npz
  condition_target: Wh
  output_repr: rho_wedge
  target_split: test

model:
  name: conditional_vae_rho
  seed: 0

runtime:
  device: cuda:0
  require_accelerator: false
  device_index: 0
  precision: fp32
  amp_enabled: false
  tf32_enabled: false
  record_peak_memory: false

inverse:
  n_candidates: 16
  surrogate_top_m: 3
  candidate_value_range:
    - 0.0
    - 1.0
  threshold: 0.5
  allow_mock_generator: false
  allow_mock_surrogate: false
  morphology_filters:
    min_fill_fraction: 0.05
    max_fill_fraction: 0.95
  ranking:
    error_metric: bands_2_10_mre

replay:
  enabled: true
  backend: real_mpb
  require_real_mpb: true
  source_experiment_id: inverse_surrogate_rerank_v2_10000
  replay_top_m: 3
  n_targets: 24
  selection_seed: 0
  primary_band_range:
    - 2
    - 10
  timeout_seconds: 900
  environment: WSL Ubuntu + conda meep_env

k_path:
  family: square_gxm
  n_total: 31
  k_path_id: inverse_strategy_replay_square_gxm_reduced_v1

solver:
  backend: mpb
  polarization: TE
  resolution: 64
  num_bands: 10
  band_guard_count: 4
  eigensolver_tolerance: 1.0e-7
  band_order_policy: frequency_ascending

metrics:
  band_ranges:
    bands_1_10:
      - 1
      - 10
    bands_2_10:
      - 2
      - 10
  gap:
    threshold_midgap_ratio: 0.0
  include:
    - best_of_k_replay_mre_bands_2_10_pct
    - best_of_k_replay_mre_bands_1_10_pct
    - best_of_k_surrogate_mre_bands_2_10_pct
    - best_of_k_surrogate_mre_bands_1_10_pct
    - surrogate_replay_gap_bands_2_10_pct
    - surrogate_replay_gap_bands_1_10_pct
    - gap_f1
    - gap_precision
    - gap_recall
    - mpb_replay_success_rate
    - mpb_replay_time_s
    - unique_candidate_solve_count
    - candidate_dedupe_savings_count

output:
  runs_dir: runs
