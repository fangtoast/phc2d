# 10k guarded V2 neural-only query surrogate CUDA preflight.
# Author: fangtoast
# Email: fangtoast@foxmail.com
# Copyright (c) 2026 fangtoast. All rights reserved.

experiment:
  experiment_id: query_band_preflight_v2_10000_neural
  family: research
  stage: query_neural_preflight

dataset:
  path: data/query_dataset_v2_pilot_10000_mpb.npz
  representation: epsilon_grid
  input_repr: epsilon_grid
  target: band_query
  output_target: band_query
  lazy_queries: true

query:
  requires_physical_k_coordinates: false
  allow_index_query: false
  boundary: neural_surrogate_no_mpb_meep_generated_not_replayed
  query_id_format: "<sample_id>:<k_path_id>:k_<zero_padded_k_index>"

runtime:
  device: cuda:0
  require_accelerator: true
  device_index: 0
  precision: fp32
  amp_enabled: false
  tf32_enabled: false
  record_peak_memory: true
  non_blocking_transfer: true
  num_workers: 0
  pin_memory: true

training:
  epochs: 1
  batch_size: 64
  learning_rate: 0.001
  device: cuda:0
  seeds:
    - 0

limits:
  max_train_structures: 32
  max_eval_structures: 16
  max_train_steps: 2
  max_eval_queries: 256

protocols:
  - unseen_structure_all_k
  - unseen_structure_k_interpolation
  - unseen_structure_heldout_segment

model:
  candidates:
    - mlp_query
    - deep_onet_query
    - fno2d_query
  overrides:
    hidden_dim: 64
    branch_width: 64
    trunk_width: 64
    latent_dim: 32
    width: 16
    depth: 2
    modes: [6, 7]
    query_hidden_dim: 32

metrics:
  include:
    - query_mae
    - query_rmse
    - query_mre_pct
    - query_mre_bands_2_10_pct
    - ordering_violation_rate
    - first_difference_mae
    - second_difference_mae
    - band_continuity_error
    - wall_time_total_s
    - train_time_s
    - eval_time_s
    - query_inference_time_per_query_ms
    - throughput_queries_per_s
    - peak_gpu_memory_mb
    - parameter_count
    - trainable_parameter_count

output:
  runs_dir: runs
  write_query_report: false
  write_dataset_audit_report: false
