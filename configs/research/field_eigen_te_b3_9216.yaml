# Copyright (c) 2026 fangtoast. All rights reserved.

experiment:
  experiment_id: field_eigen_te_b3_9216
  family: research
  stage: b3_operator_field_data

contract_path: configs/research/field_eigen_te_contract.yaml
source_dataset:
  path: data/query_dataset_v2_pilot_10000_mpb.npz

k_path_validation:
  verified_reference_dataset_path: data/query_dataset_v2_pilot_1000_mpb.npz

selection:
  operator_learning: true
  selector_seed: 20260720
  source_structure_split_counts:
    train: 192
    val: 32
    test: 32
  occupancy_strata: 4
  k_strata: 8
  k_per_structure: 4

promotion_gate:
  required_status: b2_residual_gate_pass

solver_workers:
  workers: 4
  min_workers: 4
  max_workers: 4
  worker_backend: subprocess
  fail_fast: false
  suppress_solver_output: true
  worker_thread_env:
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"

output:
  runs_dir: runs
  field_filename: field_eigen_te_b3_9216.h5
