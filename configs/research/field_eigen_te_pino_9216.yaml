experiment:
  experiment_id: field_eigen_te_pino_9216
  execution: field_eigen_v2
  stage: pino_field_adapted_pilot
dataset:
  path: runs/20260720/field_eigen_te_b3_9216_202607201608/field_eigen_te_b3_9216.h5
  expected_split_records: {train: 6912, val: 1152, test: 1152}
normalization: {epsilon_range: [1.0, 8.9], k_scale: 0.5, band_range_one_based: [2, 10]}
representation: {periodic_coordinates: true}
model:
  name: fno_field_v2
  params: {grid_channels: 5, context_dim: 3, field_channels: 6, width: 48, depth: 4, modes: [16, 16], corrected_spectral_modes: true}
training:
  regime: pino_adapted
  seed: 0
  epochs: 200
  batch_size: 16
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  weight_decay: 0.00001
  lr_warmup_epochs: 5
  early_stopping_patience: 30
  gradient_clip_norm: 1.0
  physics_warmup_epochs: 20
  physics_ramp_epochs: 20
  lambda_pde: 0.01
runtime: {device: "cuda:0", require_accelerator: true, precision: fp32, deterministic: true}
evaluation: {split: test}
pino_selection:
  lambda_sweep_run: runs/20260721/field_eigen_te_pino_lambda_sweep_9216_202607210044
  lambda_selection_path: runs/20260721/field_eigen_te_pino_lambda_sweep_9216_202607210044/lambda_selection.json
  lambda_selection_sha256: da02388da3beb574b4404c602e91863ef8a8fa2b3869c7b525bb2bcd2693e847
  selected_lambda_pde: 0.01
  selection_split: val
benchmark:
  table_filename: leaderboard.csv
  cases:
    - name: pino_adapted_seed0
      train: false
      checkpoint_path: runs/20260721/field_eigen_te_pino_lambda_sweep_9216_202607210044/cases/pino_lambda_1e-2/model.pt
      training: {seed: 0}
    - name: pino_adapted_seed1
      training: {seed: 1}
    - name: pino_adapted_seed2
      training: {seed: 2}
output: {runs_dir: runs}
