experiment: {experiment_id: full_cell_forward_upgrade_graded_10k_v1, family: full_cell_forward_upgrade, lane: graded, evidence_status: authorized_admission_and_10k_training}
dataset:
  path: data/full_cell_graded_bz9_10000_paracloud_m9_v1.h5
  grid_field: material_weight_grid_64
  expected_dataset_sha256: d16d838e098215c05dc299bf7c4bbc8c6bc00f6ef35b9772546aa4e7c2b8b728
  expected_idx_train_hash: 34f595c40cc900df0962057dc8aa740ca03412144f87ad4708c627b3d6cd61fd
  expected_idx_val_hash: 2b750661c3a728d915b44442876a83ccc3f1501c3fac63f5a023b4dead640305
  expected_idx_test_hash: c54196a2f04ce8586ab5c0d1812c677e1829485e72f57f38a730b88e3eb75b61
representation: {source: material_weight_grid, sampling: continuous, threshold: null, resolution: 64, physical_equivalence: true, label_semantics: original_continuous_medium_Wh}
models:
  mlp_mixer_band_v1: {token_grid: [16, 16], embed_dim: 256, depth: 8, token_mlp_dim: 128, channel_mlp_dim: 512, dropout: 0.05, drop_path: 0.1, layer_scale_init: 1.0e-4, head_hidden_dim: 256, band_embedding_dim: 32, fourier_frequencies: [1, 2, 4, 8]}
  res_mlp_gated_v2: {hidden_dim: 320, depth: 8, expansion: 2, dropout: 0.05, drop_path: 0.1, layer_scale_init: 1.0e-4, head_hidden_dim: 256, band_embedding_dim: 32, fourier_frequencies: [1, 2, 4, 8]}
  convnext_band_v1: {stage_dims: [48, 96, 192], stage_depths: [2, 3, 6], stem_stride: 4, kernel_size: 7, channel_expansion: 4, drop_path: 0.1, layer_scale_init: 1.0e-6, head_hidden_dim: 256, band_embedding_dim: 32, fourier_frequencies: [1, 2, 4, 8], dropout: 0.05}
  tfno2d_band_v3: {width: 64, depth: 6, modes: [12, 12], factorization_rank: 0.75, norm_groups: 8, channel_expansion: 2, local_kernel: 3, drop_path: 0.1, head_hidden_dim: 256, band_embedding_dim: 32, fourier_frequencies: [1, 2, 4, 8], dropout: 0.05}
training:
  max_epochs: 100
  early_stopping_patience: 15
  optimizer: adamw
  weight_decay: 1.0e-5
  learning_rates: {mlp_mixer_band_v1: 3.0e-4, res_mlp_gated_v2: 3.0e-4, convnext_band_v1: 1.0e-3, tfno2d_band_v3: 5.0e-4}
  micro_batch_size: 64
  effective_batch_size: 64
  loss: normalized_full_matrix_mse
  checkpoint_selection: validation_bands_2_10_mre
runtime: {device: 'cuda:0', require_accelerator: true, precision: fp32, amp_enabled: false, tf32_enabled: false, num_workers: 4, pin_memory: true, non_blocking_transfer: true}
output: {runs_dir: runs}
