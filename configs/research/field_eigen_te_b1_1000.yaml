experiment:
  experiment_id: field_eigen_te_b1_1000
  family: research
  stage: b1_1000_real_mpb_field_data_ready

contract_path: configs/research/field_eigen_te_contract.yaml
source_dataset:
  path: data/query_dataset_v2_pilot_10000_mpb.npz

k_path_validation:
  verified_reference_dataset_path: data/query_dataset_v2_pilot_1000_mpb.npz

selection:
  selector_seed: 20260720
  source_split_counts:
    train: 750
    val: 125
    test: 125
  occupancy_strata: 4
  k_strata: 8

promotion_gate:
  required_status: b2_residual_gate_pass

solver_workers:
  workers: 4
  min_workers: 4
  max_workers: 4
  worker_backend: subprocess
  fail_fast: false
  suppress_solver_output: true
  worker_thread_env:
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"

output:
  runs_dir: runs
  field_filename: field_eigen_te_b1_1000.h5
