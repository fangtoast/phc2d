# Approved planar PCSEL geometry transfer dataset, twelve families of 2000.
# Author: fangtoast
# Email: fangtoast@foxmail.com
# Copyright (c) 2026 fangtoast. All rights reserved.
experiment:
  experiment_id: EXP-DAT-008
  family: research
  stage: dataset_generation
dataset:
  protocol: full_cell_pcsel_v1
  lane: pcsel_twelve_family
  output_path: data/exp_dat_008_pcsel_twelve_family_bz9_24000_bingxing_v1.h5
  sample_count: 24000
  split: {train: 0, val: 0, test: 24000}
  seed: 0
  raster_resolutions: [32, 64, 128, 256]
  raster_contract:
    method: master_block_mean_v1
    source_resolution: 256
    content_hash_algorithm: phc2d.full_cell.content_hash.v1
    content_hash_quantization_levels: 65536
    binary_source_field: material_binary_grid_256
    binary_downsampled_field_prefix: material_area_fraction_grid_
generator:
  algorithm_version: phc2d.analytic_pcsel.v1
  parameter_plan: approved_atlas_draft01_2000_per_family
  families: [S01, S02, D01, D02, D03, D04, D05, T01, T02, T03, Q01, U01]
  samples_per_family: 2000
  epsilon_air: 1.0
  epsilon_material: 8.9
  audit_resolution: 256
  plan_workers: 64
  input_collision_policy: retain_and_report_with_analytic_identity
  symmetry_equivalence_policy: grouped_not_iid
solver:
  backend: mpb
  environment: native_linux_conda_meep_env
  expected_meep_version: 1.33.0-beta
  expected_mpb_version: 1.12.0
  use_proxy: false
  lattice: square
  lattice_constant: 1.0
  epsilon_air: 1.0
  epsilon_material: 8.9
  resolution: 64
  resolution_status: frozen_r64_generation_only_new_geometry_accuracy_unassessed
  resolution_evidence: approved_geometry_atlas_and_user_generation_authorization
  mesh_size: 3
  polarization: TE
  num_bands: 10
  band_guard_count: 4
  band_order_policy: frequency_ascending
  eigensolver_tolerance: 1.0e-7
k_grid:
  family: square_full_bz
  n_side: 9
  coordinate_system: mpb_reduced_reciprocal_coordinates
  endpoint_policy: centered_unique_no_boundary_duplicates
workers:
  workers: 64
  min_workers: 1
  max_workers: 64
  worker_backend: processpool
  fail_fast: false
  suppress_solver_output: true
  worker_thread_env:
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
authorization:
  formal_generation_authorized: true
  authorized_by: user
  authorized_date: "2026-10-21"
  authorization_scope: approved_twelve_family_atlas_m9_generation_and_n40_delivery
  automatic_retry_authorized: false
  model_evaluation_authorized: false
  resource_change_authorized: false
acceptance:
  cluster_generation_is_not_wsl_acceptance: true
  required_wsl_environment: Ubuntu/meep_env
  transfer_hash_match_required: true
  full_gap_claim: false
  label_resolution_convergence_status: unassessed_for_new_geometries
  device_replication_claim: false
output:
  runs_dir: runs
