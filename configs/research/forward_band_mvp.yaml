experiment:
  experiment_id: forward_band_mvp
  family: research
  stage: forward_benchmark
dataset:
  path: data/paper_like_64_mpb.npz
  input_repr: rho_wedge
  output_target: Wh
model:
  candidates:
    - res_mlp
    - lifted_cnn
    - fno_lite
benchmark:
  - input_repr: rho_wedge
    model: res_mlp
    output_target: Wh
  - input_repr: rho_grid
    model: lifted_cnn
    output_target: Wh
  - input_repr: epsilon_grid
    model: lifted_cnn
    output_target: Wh
  - input_repr: epsilon_grid
    model: fno_lite
    output_target: Wh
training:
  epochs: 2
  batch_size: 8
  device: auto
  formal_training: false
runtime:
  device: auto
  require_accelerator: true
  device_index: 0
  precision: fp32
  amp_enabled: false
  tf32_enabled: false
  non_blocking_transfer: true
  record_peak_memory: true
metrics:
  include:
    - mse
    - mae
    - rmse
    - avg_MRE_pct
    - avg_MRE_bands_2_10_pct
    - wall_time_total_s
    - train_time_s
    - eval_time_s
    - inference_time_per_sample_ms
    - throughput_samples_per_s
    - parameter_count
output:
  runs_dir: runs
