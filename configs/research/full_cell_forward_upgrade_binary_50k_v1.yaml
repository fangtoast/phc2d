representation: {source: material_weight_grid, sampling: continuous, threshold: null, resolution: 64, physical_equivalence: true, label_semantics: binary_medium_Wh}
models:
  mlp_mixer_band_v1: {token_grid: [16, 16], embed_dim: 256, depth: 8, token_mlp_dim: 128, channel_mlp_dim: 512, dropout: 0.05, drop_path: 0.1, layer_scale_init: 1.0e-4, head_hidden_dim: 256, band_embedding_dim: 32, fourier_frequencies: [1, 2, 4, 8]}
  res_mlp_gated_v2: {hidden_dim: 320, depth: 8, expansion: 2, dropout: 0.05, drop_path: 0.1, layer_scale_init: 1.0e-4, head_hidden_dim: 256, band_embedding_dim: 32, fourier_frequencies: [1, 2, 4, 8]}
  convnext_band_v1: {stage_dims: [48, 96, 192], stage_depths: [2, 3, 6], stem_stride: 4, kernel_size: 7, channel_expansion: 4, drop_path: 0.1, layer_scale_init: 1.0e-6, head_hidden_dim: 256, band_embedding_dim: 32, fourier_frequencies: [1, 2, 4, 8], dropout: 0.05}
