experiment: {experiment_id: field_eigen_te_v2_fno_a2_1k, execution: field_eigen_v2, stage: field_v2_ablation}
dataset:
  path: runs/20260720/field_eigen_te_b1_1000_202607201058/field_eigen_te_b1_1000.h5
  expected_split_records: {train: 750, val: 125, test: 125}
normalization: {epsilon_range: [1.0, 8.9], k_scale: 0.5, band_range_one_based: [2, 10]}
representation: {periodic_coordinates: true}
model:
  name: fno_field_v2
  params: {grid_channels: 5, context_dim: 3, field_channels: 6, width: 48, depth: 4, modes: [16, 16], use_film: true, corrected_spectral_modes: false}
training:
  regime: data_only
  seed: 0
  epochs: 80
  batch_size: 16
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  weight_decay: 0.00001
  lr_warmup_epochs: 5
  early_stopping_patience: 30
  gradient_clip_norm: 1.0
  lambda_pde: 0.0
runtime: {device: "cuda:0", require_accelerator: true, precision: fp32}
evaluation: {split: val}
output: {runs_dir: runs}
