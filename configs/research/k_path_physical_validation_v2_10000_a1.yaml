# A1 10k V2 five-sample real-MPB k-path validation.
# Author: fangtoast
# Email: fangtoast@foxmail.com
# Copyright (c) 2026 fangtoast. All rights reserved.

experiment_id: k_path_physical_validation_v2_10000_a1

dataset:
  path: data/query_dataset_v2_pilot_10000_mpb.npz
  manifest: data/metadata/query_dataset_v2_pilot_10000_mpb.manifest.yaml
  k_path_sidecar: query_dataset_v2_pilot_10000_mpb.kpath.v1.json
  solver_provenance: data/metadata/query_dataset_v2_pilot_10000_mpb.solver_provenance.json
  expected_dataset_sha256: 991cb3810e881938755495ad0bccfa5b091194c2b74451842a9a50ddce974ad4
  expected_split_sizes: {train: 6875, val: 2500, test: 625}

sample_selection:
  strategy: deterministic_stratified
  train_count: 2
  val_count: 1
  test_count: 2
  seed: 0
  rule: first_n_from_10k_v2_fixed_split_train2_val1_test2

solver:
  backend: mpb
  environment: wsl_meep_env
  use_proxy: false
  workers: 1
  min_workers: 1
  max_workers: 1
  worker_backend: subprocess
  fail_fast: true
  worker_thread_env:
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"

comparison:
  compare_domain: physical_frequency
  band_1_separate: true
  record_per_k: true
  record_per_band: true
  repeat_first_sample_count: 2
  accepted_tolerance:

output:
  runs_dir: runs
  promote_verified_sidecar: true
