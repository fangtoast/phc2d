# 10k v2b uniqueness-repair inverse candidates paired unique-target real-MPB replay.
# Author: fangtoast
# Email: fangtoast@foxmail.com
# Copyright (c) 2026 fangtoast. All rights reserved.

experiment:
  experiment_id: inverse_mpb_replay_uniqueness_repair_v2b_10000_unique24
  family: research
  stage: inverse_candidate_real_mpb_replay_unique_target_control

dataset:
  path: data/query_dataset_v2_pilot_10000_mpb.npz
  condition_target: Wh
  output_repr: rho_wedge
  target_split: test

model:
  name: conditional_vae_rho
  seed: 0

inverse:
  n_candidates: 64
  surrogate_top_m: 3
  threshold: 0.5
  ranking:
    error_metric: bands_2_10_mre

replay:
  enabled: true
  backend: real_mpb
  require_real_mpb: true
  environment: WSL Ubuntu + conda meep_env
  source_experiment_id: inverse_generator_uniqueness_repair_v2b_10000_sample
  selection_unit: target_index
  within_target_record_policy: best_surrogate_mre_bands_2_10
  target_indices_path: runs/20260630/inverse_v2_10000_unique24_target_indices.json
  replay_top_m: 3
  n_targets: 24
  selection_seed: 20260629
  selection_strategy: paired_target_indices_from_anti_exploit_unique24
  primary_band_range:
    - 2
    - 10
  timeout_seconds: 900
  note: auto-resolves the latest timestamped v2b uniqueness sample run after the preflight gate passes.

solver:
  backend: mpb
  use_proxy: false
  lattice: square
  lattice_constant: 1.0
  epsilon_air: 1.0
  epsilon_material: 8.9
  resolution: 64
  polarization: TE
  num_bands: 10
  band_guard_count: 4
  band_order_policy: frequency_ascending
  eigensolver_tolerance: 1.0e-07

geometry:
  representation: rho_wedge
  grid_shape:
    - 16
    - 16
  lifting: p4m_wedge_binary_pixels_as_mpb_blocks_air_background

k_path:
  family: square_gxm
  k_path_id: query_dataset_v2_pilot_square_gxm_mpb_reduced_v1
  n_total: 31
  coordinate_system: mpb_reduced_reciprocal_coordinates

metrics:
  band_ranges:
    bands_1_10:
      - 1
      - 10
    bands_2_10:
      - 2
      - 10
  gap:
    threshold_midgap_ratio: 0.0
  include:
    - best_of_k_replay_mre_bands_2_10_pct
    - best_of_k_surrogate_mre_bands_2_10_pct
    - surrogate_replay_gap_bands_2_10_pct
    - gap_f1
    - mpb_replay_success_rate
    - mpb_replay_time_s

output:
  runs_dir: runs
