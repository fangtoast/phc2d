# Resolution-convergence gate for both 64-sample full-cell lanes.
# Author: fangtoast
# Email: fangtoast@foxmail.com
# Copyright (c) 2026 fangtoast. All rights reserved.

experiment:
  experiment_id: full_cell_resolution_convergence_v1
  family: research
  stage: resolution_convergence

datasets:
  graded_medium: data/full_cell_graded_bz9_pilot64.h5
  binary_air_holes: data/full_cell_binary_holes_bz9_pilot64.h5

selection:
  samples_per_lane: 8
  policy: deterministic_round_robin_by_generator_stratum
  k_policy: full_bz_center_axis_edges_and_corners

resolutions: [64, 96, 128]

solver:
  backend: mpb
  environment: wsl_meep_env
  use_proxy: false
  lattice: square
  lattice_constant: 1.0
  epsilon_air: 1.0
  epsilon_material: 8.9
  resolution: 64
  mesh_size: 3
  polarization: TE
  num_bands: 10
  band_guard_count: 4
  band_order_policy: frequency_ascending
  eigensolver_tolerance: 1.0e-7

workers:
  workers: 4
  min_workers: 1
  max_workers: 8
  worker_backend: processpool
  fail_fast: false
  suppress_solver_output: true
  worker_thread_env:
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"

gates:
  metric_scope: bands_2_plus
  median_mre_64_96_max: 0.005
  median_mre_96_128_max: 0.0025
  p95_mre_max: 0.01

output:
  runs_dir: runs
