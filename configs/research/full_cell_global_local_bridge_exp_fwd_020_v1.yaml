schema_version: phc2d.global_local_bridge.v1
experiment:
  experiment_id: EXP-FWD-020
  family: full_cell_global_local_bridge
  evidence_status: implemented_not_authorized
  primary_layer: L2_method_architecture
representation:
  input_field: material_weight_grid_64
  target_field: Wh
  target_shape: [81, 10]
split:
  per_lane: {train: 40000, validation: 5000, held_out_test: 5000}
  selection_split: validation
  test_targets_loaded: false
datasets:
  binary:
    path: data/full_cell_binary_bz9_50000_xingyi_v1.h5
    sha256: e2d99e0c59c3bf5dfebc507e756dbcd18c8623f331ad6193832d774df5213f00
  graded:
    path: data/full_cell_graded_bz9_50000_xingyi_v1.h5
    sha256: 172786bc4b689d13f5938480fe82c25a4b8d9bad9a7d98bcd7eac778dad38a46
model:
  name: global_local_band_operator_v1
  shared_params:
    width: 64
    depth: 6
    modes: [12, 12]
    factorization_rank: 0.75
    norm_groups: 8
    channel_expansion: 4
    drop_path: 0.1
    head_kind: dense
    head_hidden_dim: 256
    band_embedding_dim: 32
    fourier_frequencies: [1, 2, 4, 8]
    dropout: 0.05
  paired_variants:
    baseline: {local_kernel: 3}
    candidate: {local_kernel: 7}
training:
  optimizer: adamw
  weight_decay: 1.0e-5
  loss: normalized_full_matrix_mse
  learning_rate: 5.0e-4
  micro_batch_size: 64
  effective_batch_size: 64
  precision: fp32
  amp_enabled: false
  tf32_enabled: false
protocol:
  seed0_screen:
    seed: 0
    max_epochs: 20
    selection_metric: validation_bands_2_10_mre
    require_candidate_better_each_lane: true
    minimum_relative_improvement_pct_each_lane: 1.0
    maximum_parameter_ratio: 1.05
    stop_on_lane_reversal: true
  confirmation:
    gated_by: seed0_screen_pass
    seeds: [0, 1, 2]
    max_epochs: 200
    require_direction_consistency_each_lane: true
    require_baseline_and_candidate_convergence: true
  cross_domain:
    gated_by: confirmation_pass
    domains: [k5_binary, k5_graded, k20_binary, k20_graded, f50_binary, f50_graded]
  final_test:
    gated_by: frozen_cross_domain_acceptance
    maximum_reads: 1
runtime:
  target_platform: paracloud
  partition: gpu_4090
  gpus_per_task: 1
  cpus_per_task: 6
  memory_mb: 60000
authorization:
  granted: false
  prohibited_until_granted: [remote_submission, training, automatic_retry, resource_change, held_out_test, real_MPB, real_Meep]
