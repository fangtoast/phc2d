# B3 seed-0 representation and architecture ablation on the diagnostic 1k dataset.
# Author: fangtoast
# Email: fangtoast@foxmail.com
# Copyright (c) 2026 fangtoast. All rights reserved.

experiment:
  experiment_id: field_eigen_te_v2_ablation_1k
  execution: field_eigen_v2
  stage: field_v2_ablation
dataset:
  path: runs/20260720/field_eigen_te_b1_1000_202607201058/field_eigen_te_b1_1000.h5
  expected_split_records: {train: 750, val: 125, test: 125}
normalization:
  epsilon_range: [1.0, 8.9]
  k_scale: 0.5
  band_range_one_based: [2, 10]
representation:
  periodic_coordinates: true
model:
  name: fno_field_v2
  params: {grid_channels: 5, context_dim: 3, field_channels: 6, width: 48, depth: 4, modes: [16, 16]}
training:
  regime: data_only
  seed: 0
  epochs: 80
  batch_size: 16
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  weight_decay: 0.00001
  lr_warmup_epochs: 5
  early_stopping_patience: 30
  gradient_clip_norm: 1.0
  lambda_pde: 0.0
runtime: {device: "cuda:0", require_accelerator: true, precision: fp32}
evaluation: {split: val}
benchmark:
  table_filename: ablation.csv
  cases:
    - name: unet_a1_active_phase
      model: {name: unet_field, params: {input_channels: 1, field_channels: 6, width: 32, depth: 2}}
      representation: {periodic_coordinates: false}
    - name: unet_a3_conditioned_residual
      model: {name: unet_field_v2, params: {grid_channels: 5, context_dim: 3, field_channels: 6, width: 48, depth: 3}}
    - name: fno_a1_active_phase
      model: {name: fno_field, params: {input_channels: 1, field_channels: 6, width: 32, depth: 4, modes: [12, 12]}}
      representation: {periodic_coordinates: false}
    - name: fno_a2_conditioned
      model: {name: fno_field_v2, params: {grid_channels: 5, context_dim: 3, field_channels: 6, width: 48, depth: 4, modes: [16, 16], corrected_spectral_modes: false}}
    - name: fno_a3_corrected_spectral
      model: {name: fno_field_v2, params: {grid_channels: 5, context_dim: 3, field_channels: 6, width: 48, depth: 4, modes: [16, 16], corrected_spectral_modes: true}}
output: {runs_dir: runs}
