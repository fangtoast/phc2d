schema_version: phc2d.full_cell_parameter_ablation.v1
experiment:
  experiment_id: full_cell_forward_parameter_ablation_v1
  family: full_cell_forward_parameter_ablation
  primary_layer: L3
  evidence_status: preregistered_single_seed_screen
datasets:
  binary:
    source_config: configs/research/full_cell_forward_binary_native_50000_v1.yaml
    upgrade_config: configs/research/full_cell_forward_upgrade_binary_50k_v1.yaml
    path: data/full_cell_binary_bz9_50000_xingyi_v1.h5
    expected_dataset_sha256: e2d99e0c59c3bf5dfebc507e756dbcd18c8623f331ad6193832d774df5213f00
  graded:
    source_config: configs/research/full_cell_forward_graded_continuous_50000_v1.yaml
    upgrade_config: configs/research/full_cell_forward_upgrade_graded_50k_v1.yaml
    path: data/full_cell_graded_bz9_50000_xingyi_v1.h5
    expected_dataset_sha256: 172786bc4b689d13f5938480fe82c25a4b8d9bad9a7d98bcd7eac778dad38a46
  joint:
    source_config: configs/research/full_cell_forward_upgrade_dual_lane_50k_v1.yaml
representation:
  input_field: material_weight_grid_64
  input_shape: [64, 64]
  target_field: Wh
  target_shape: [81, 10]
split:
  per_lane: {train: 40000, validation: 5000, held_out_test: 5000}
  test_access: forbidden_during_stage_a_and_b
protocol:
  seed: 0
  head_kind: dense
  stage_a: {admission_probe: true, gpu_concurrency: 3}
  stage_b:
    train_size: 40000
    max_epochs: 20
    gpu_concurrency: 3
    selection_metric: validation_bands_2_10_mre_pct
    minimum_relative_improvement: 0.01
    stop_on_non_finite: true
    early_stopping_patience: 0
  fixed:
    optimizer: adamw
    weight_decay: 1.0e-5
    precision: fp32
    amp_enabled: false
    tf32_enabled: false
    effective_batch_size: 64
    loss: normalized_full_matrix_mse
    checkpoint_selection: validation_bands_2_10_mre
evidence_sources:
  runner: src/phc2d/forward/full_cell.py
  dual_runner: src/phc2d/forward/full_cell_dual_lane.py
  catalog: src/phc2d/models/catalog/full_cell.py
  implementation_root: src/phc2d/models
  baseline_report: docs/results/forward/full_cell_dual_lane_50000_forward_training_20260808.md
  upgrade_report: docs/results/forward/full_cell_forward_model_upgrade_50k_evaluation_20260810.md
  baseline_artifacts: runs/20260808/full_cell_forward_50k_evaluation_campaign_20260808162200
  upgrade_artifacts: runs/20260810/full_cell_upgrade_50k_evaluation_20260810085944
