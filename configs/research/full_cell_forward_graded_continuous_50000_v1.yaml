experiment: {experiment_id: full_cell_forward_graded_continuous_50000_v1, family: full_cell_forward, lane: graded, evidence_status: authorized_formal_training_without_local_wsl_acceptance}
dataset:
  path: data/full_cell_graded_bz9_50000_xingyi_v1.h5
  grid_field: material_weight_grid_64
