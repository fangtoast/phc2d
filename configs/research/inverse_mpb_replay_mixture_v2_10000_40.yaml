# 10k guarded V2 mixture inverse 40-target real-MPB replay gate.
# Author: fangtoast
# Email: fangtoast@foxmail.com
# Copyright (c) 2026 fangtoast. All rights reserved.

experiment:
  experiment_id: inverse_mpb_replay_mixture_v2_10000_40
  family: research
  stage: inverse_candidate_real_mpb_replay

dataset:
  path: data/query_dataset_v2_pilot_10000_mpb.npz
  condition_target: Wh
  output_repr: rho_wedge
  target_split: test

model:
  name: mixture_conditional_generator
  seed: 0

inverse:
  n_candidates: 128
  surrogate_top_m: 5
  threshold: 0.5
  ranking:
    error_metric: bands_2_10_mre

replay:
  enabled: true
  backend: real_mpb
  require_real_mpb: true
  environment: WSL Ubuntu + conda meep_env
  source_experiment_id: inverse_mixture_generator_v2_10000_objective_sample_separation
  candidates_path: runs/20260706/inverse_mixture_generator_v2_10000_objective_sample_separation_202607060848/candidates.json
  ranked_candidates_path: runs/20260706/inverse_mixture_generator_v2_10000_objective_sample_separation_202607060848/ranked_candidates.csv
  selection_unit: target_index
  within_target_record_policy: best_surrogate_mre_bands_2_10
  replay_top_m: 5
  n_targets: 40
  selection_seed: 20260702
  selection_strategy: preflight_passed_unique_target_index_40
  primary_band_range: [2, 10]
  timeout_seconds: 900
  preflight_override: false
  diagnostic_only: false

solver:
  backend: mpb
  use_proxy: false
  lattice: square
  lattice_constant: 1.0
  epsilon_air: 1.0
  epsilon_material: 8.9
  resolution: 64
  polarization: TE
  num_bands: 10
  band_guard_count: 4
  band_order_policy: frequency_ascending
  eigensolver_tolerance: 1.0e-07

geometry:
  representation: rho_wedge
  grid_shape: [16, 16]
  lifting: p4m_wedge_binary_pixels_as_mpb_blocks_air_background

k_path:
  family: square_gxm
  k_path_id: query_dataset_v2_pilot_square_gxm_mpb_reduced_v1
  n_total: 31
  coordinate_system: mpb_reduced_reciprocal_coordinates

metrics:
  band_ranges:
    bands_1_10: [1, 10]
    bands_2_10: [2, 10]
  gap:
    threshold_midgap_ratio: 0.0
  include:
    - best_of_k_replay_mre_bands_2_10_pct
    - best_of_k_surrogate_mre_bands_2_10_pct
    - surrogate_replay_gap_bands_2_10_pct
    - gap_f1
    - mpb_replay_success_rate
    - mpb_replay_time_s

output:
  runs_dir: runs
  run_dir: runs/20260706/inverse_mpb_replay_mixture_v2_10000_40_202607060853
