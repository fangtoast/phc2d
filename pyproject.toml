[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phc2d"
version = "0.2.0"
description = "Unified 2D photonic-crystal data, training, inverse-design, replay, and plotting workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.scripts]
phc2d = "phc2d.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]
train = ["torch>=2.0", "h5py>=3.9", "tqdm>=4.65", "joblib>=1.3"]
docs = [
    "mkdocs==1.6.1",
    "pymdown-extensions==11.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: MPB/Meep or long-running integration checks that require WSL meep_env",
]

[tool.ruff]
line-length = 100
target-version = "py310"
